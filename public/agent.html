<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KARI-NA · 상담사 실시간 자막</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family:'Pretendard','Geist Sans',system-ui,sans-serif; background:#f8fafc; color:#0f172a; }
  header { padding:16px 24px; background:#fff; border-bottom:1px solid #e2e8f0; display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
  header h1 { font-size:16px; margin:0; flex:1; }
  input { padding:8px 11px; border-radius:9px; border:1px solid #cbd5e1; font-size:13px; }
  button { padding:9px 16px; border:none; border-radius:9999px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; }
  .status { font-size:12.5px; color:#64748b; padding:8px 24px; }
  #log { padding:16px 24px; display:flex; flex-direction:column; gap:10px; }
  .line { background:#fff; border:1px solid #e2e8f0; border-radius:12px; padding:12px 14px; box-shadow:0 1px 2px rgba(0,0,0,.04);
          animation:in .2s ease; }
  @keyframes in { from{opacity:0; transform:translateY(6px)} to{opacity:1; transform:none} }
  .line .meta { font-size:11px; color:#94a3b8; margin-bottom:3px; }
  .line .txt { font-size:15px; line-height:1.5; }
  .empty { color:#94a3b8; font-size:13px; padding:24px; text-align:center; }
</style>
</head>
<body>
  <header>
    <h1>🎧 상담사 콘솔 — 실시간 자막</h1>
    <input id="callId" value="demo1" title="통화 ID" />
    <button id="btn">연결</button>
  </header>
  <div class="status" id="status">대기 중 — '연결'을 누르고, 고객이 customer.html에서 같은 통화 ID로 말하면 자막이 뜹니다.</div>
  <div id="log"><div class="empty">아직 자막 없음</div></div>
<script>
let ws=null;
const $ = (id)=>document.getElementById(id);
function connect(){
  const callId = ($("callId").value||"demo1").trim();
  const wsUrl = (location.protocol==="https:"?"wss":"ws")+"://"+location.hostname+":8000/ws/call/"+encodeURIComponent(callId)+"?role=agent";
  if(ws){ try{ws.close();}catch(e){} }
  ws = new WebSocket(wsUrl);
  ws.onopen = ()=> $("status").textContent="연결됨 (통화 ID: "+callId+") — 고객 발화를 기다리는 중…";
  ws.onclose = ()=> $("status").textContent="연결 끊김 — 다시 '연결'을 누르세요.";
  ws.onerror = ()=> $("status").textContent="연결 오류 — 백엔드(8000) 실행/방화벽 확인.";
  ws.onmessage = (ev)=>{
    let m; try{ m=JSON.parse(ev.data); }catch(e){ return; }
    if(m.type==="transcript"){
      const empty=document.querySelector(".empty"); if(empty) empty.remove();
      const t=new Date(m.at||Date.now());
      const hh=("0"+t.getHours()).slice(-2)+":"+("0"+t.getMinutes()).slice(-2)+":"+("0"+t.getSeconds()).slice(-2);
      const div=document.createElement("div"); div.className="line";
      div.innerHTML='<div class="meta">고객 · '+hh+' · #'+m.seq+'</div><div class="txt"></div>';
      div.querySelector(".txt").textContent=m.text;
      $("log").appendChild(div);
      window.scrollTo(0, document.body.scrollHeight);
    }
  };
}
$("btn").onclick = connect;
</script>
</body>
</html>
