<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>KARI-NA · 고객 통화 (실시간 마이크)</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; font-family:'Pretendard','Geist Sans',system-ui,sans-serif; background:#0f172a; color:#e2e8f0;
         min-height:100vh; display:flex; align-items:center; justify-content:center; }
  .card { width:min(440px,92vw); background:#1e293b; border-radius:20px; padding:32px; box-shadow:0 20px 60px rgba(0,0,0,.4); }
  h1 { font-size:19px; margin:0 0 4px; }
  .sub { font-size:13px; color:#94a3b8; margin:0 0 24px; }
  label { font-size:12px; color:#94a3b8; display:block; margin:14px 0 6px; }
  input { width:100%; box-sizing:border-box; padding:10px 12px; border-radius:10px; border:1px solid #334155;
          background:#0f172a; color:#e2e8f0; font-size:14px; }
  button { width:100%; margin-top:20px; padding:16px; border:none; border-radius:9999px; font-size:16px; font-weight:700;
           cursor:pointer; transition:.15s; }
  .start { background:#22c55e; color:#052e16; }
  .start:hover { background:#16a34a; }
  .stop { background:#ef4444; color:#fff; }
  .status { margin-top:20px; padding:14px; border-radius:12px; background:#0f172a; font-size:13px; line-height:1.6; }
  .dot { display:inline-block; width:9px; height:9px; border-radius:50%; margin-right:7px; vertical-align:middle; }
  .lv { height:8px; background:#0f172a; border-radius:4px; margin-top:10px; overflow:hidden; }
  .lv > i { display:block; height:100%; width:0; background:#22c55e; transition:width .08s; }
</style>
</head>
<body>
  <div class="card">
    <h1>📞 고객 통화 — KARI-NA</h1>
    <p class="sub">이 페이지의 마이크 음성이 실시간으로 전사되어 상담사 화면에 자막으로 뜹니다.</p>
    <label>통화 ID (상담사와 같은 값)</label>
    <input id="callId" value="demo1" />
    <button id="btn" class="start">통화 시작 (마이크 켜기)</button>
    <div class="status" id="status"><span class="dot" style="background:#64748b"></span>대기 중</div>
    <div class="lv"><i id="level"></i></div>
  </div>
<script>
let ws=null, ctx=null, src=null, proc=null, stream=null, on=false;
const $ = (id)=>document.getElementById(id);
function setStatus(color, text){ $("status").innerHTML = '<span class="dot" style="background:'+color+'"></span>'+text; }

function floatToInt16(f32){
  const i16 = new Int16Array(f32.length);
  for(let i=0;i<f32.length;i++){ let s=Math.max(-1,Math.min(1,f32[i])); i16[i]= s<0 ? s*0x8000 : s*0x7FFF; }
  return i16;
}

async function start(){
  const callId = ($("callId").value||"demo1").trim();
  const wsUrl = (location.protocol==="https:"?"wss":"ws")+"://"+location.hostname+":8000/ws/call/"+encodeURIComponent(callId)+"?role=customer";
  setStatus("#eab308","마이크 권한 요청 중…");
  try {
    stream = await navigator.mediaDevices.getUserMedia({ audio:{ echoCancellation:true, noiseSuppression:true } });
  } catch(e){ setStatus("#ef4444","마이크 권한 거부/실패: "+e.message); return; }

  ws = new WebSocket(wsUrl);
  ws.binaryType = "arraybuffer";
  ws.onopen = ()=> setStatus("#22c55e","연결됨 — 말씀하세요. 상담사 화면에 자막이 뜹니다.");
  ws.onclose = ()=> { if(on) setStatus("#ef4444","연결 끊김"); };
  ws.onerror = ()=> setStatus("#ef4444","연결 오류 (백엔드 8000 확인)");

  ctx = new (window.AudioContext||window.webkitAudioContext)({ sampleRate:16000 });
  if(ctx.state==="suspended") await ctx.resume();
  src = ctx.createMediaStreamSource(stream);
  proc = ctx.createScriptProcessor(4096,1,1);
  src.connect(proc); proc.connect(ctx.destination); // 출력엔 안 씀(무음) → 에코 없음
  proc.onaudioprocess = (e)=>{
    const f32 = e.inputBuffer.getChannelData(0);
    // 레벨 미터
    let sum=0; for(let i=0;i<f32.length;i++) sum+=f32[i]*f32[i];
    $("level").style.width = Math.min(100, Math.sqrt(sum/f32.length)*300)+"%";
    if(ws && ws.readyState===1) ws.send(floatToInt16(f32).buffer);
  };
  on = true; $("btn").textContent="통화 종료"; $("btn").className="stop";
}

function stop(){
  on=false;
  try{ proc && (proc.onaudioprocess=null, proc.disconnect()); }catch(e){}
  try{ src && src.disconnect(); }catch(e){}
  try{ ctx && ctx.close(); }catch(e){}
  try{ stream && stream.getTracks().forEach(t=>t.stop()); }catch(e){}
  try{ ws && ws.close(); }catch(e){}
  $("btn").textContent="통화 시작 (마이크 켜기)"; $("btn").className="start";
  $("level").style.width="0"; setStatus("#64748b","통화 종료됨");
}

$("btn").onclick = ()=> on ? stop() : start();
</script>
</body>
</html>
