name: k7-local-demo

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        VITE_USE_REAL_DATA_API: "true"
        VITE_API_BASE_URL: ""
        VITE_DATA_API_PREFIX: /api/v1
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "${K7_HTTP_PORT:-8080}:8080"
    networks:
      - edge
      - k7_internal
    restart: unless-stopped

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      PIPELINE_MODE: local
      DATABASE_URL: postgresql://${POSTGRES_USER:-k7}:${POSTGRES_PASSWORD:-k7-demo-only}@db:5432/${POSTGRES_DB:-k7}
      LOCAL_STT_MODEL: ${LOCAL_STT_MODEL:-small}
      LOCAL_STT_DEVICE: ${LOCAL_STT_DEVICE:-cpu}
      LOCAL_STT_COMPUTE_TYPE: ${LOCAL_STT_COMPUTE_TYPE:-int8}
      LOCAL_STT_MODEL_DIR: /models/whisper
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-exaone3.5:2.4b}
      OLLAMA_TIMEOUT_SEC: ${OLLAMA_TIMEOUT_SEC:-600}
      ROUTING_TOPIC_ENABLED: ${ROUTING_TOPIC_ENABLED:-true}
      ROUTING_TOPIC_MODEL_PATH: /app/backend/app/services/routing/models/bank_topic_classifier.joblib
      ROUTING_TOPIC_MODEL_SHA256: ${ROUTING_TOPIC_MODEL_SHA256:-0474677A2C335817F9F677A37077C3E56C81BD2CB3378E506B6479910A263832}
      ROUTING_TOPIC_MARGIN_THRESHOLD: ${ROUTING_TOPIC_MARGIN_THRESHOLD:-0.75}
      FRONTEND_ORIGIN: http://localhost:${K7_HTTP_PORT:-8080}
      EXTRA_CORS_ORIGINS: ""
    volumes:
      - ./models/whisper:/models/whisper
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    networks:
      - k7_internal
    restart: unless-stopped

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-k7}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-k7-demo-only}
      POSTGRES_DB: ${POSTGRES_DB:-k7}
    volumes:
      - k7_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-k7} -d ${POSTGRES_DB:-k7}"]
      interval: 5s
      timeout: 5s
      retries: 20
    networks:
      - k7_internal
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - k7_ollama:/root/.ollama
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 10s
      retries: 20
      start_period: 20s
    networks:
      - k7_internal
    restart: unless-stopped

networks:
  edge:
  k7_internal:

volumes:
  k7_postgres:
  k7_ollama:
