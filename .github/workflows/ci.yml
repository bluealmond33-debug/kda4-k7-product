name: K7 MVP CI

on:
  pull_request:
  push:
    branches: [main, lch]

permissions:
  contents: read

jobs:
  frontend-contracts:
    name: React and contracts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  backend:
    name: FastAPI and MVP database contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install --disable-pip-version-check -r backend/requirements.txt
      - run: python -m pytest backend/tests -q
      - run: python -m compileall -q backend/app
